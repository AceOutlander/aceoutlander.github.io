<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Account · HunterAceDev</title>
<style>
:root{ --bg:#eef5fb; --panel:#ffffff; --edge:#c6dcf0; --ink:#10243a; --dim:#495c70; --accent:#1d6fc8; --accent-ink:#ffffff; --radius:12px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --head:700 1.5em system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --caps:none; --track:0 }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;min-height:100dvh}
.card{width:100%;max-width:30em;background:var(--panel);border:2px solid var(--edge);border-radius:var(--radius);padding:1.5em 1.4em}
h1{font:var(--head);text-transform:var(--caps);letter-spacing:var(--track);margin:0 0 .5em;line-height:1.2}
p{margin:.6em 0;color:var(--dim)} p.lead{color:var(--ink)}
.game{font-size:.8em;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);margin-bottom:.6em}
.row{display:flex;gap:.7em;flex-wrap:wrap;margin-top:1.1em}
button,a.btn{font:700 1em var(--font);text-transform:var(--caps);letter-spacing:var(--track);padding:.7em 1.2em;border-radius:var(--radius);border:2px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;min-height:2.9em;flex:1 1 auto;text-align:center}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
body[data-chunky] button{border-width:2.5px;box-shadow:0 4px 0 var(--edge)} body[data-chunky] button.primary{border-color:var(--edge)}
button.link{border:0;background:none;color:var(--dim);text-decoration:underline;flex:0 0 auto;padding:.4em;min-height:0;font-weight:400;text-transform:none;letter-spacing:0}
button.danger{color:#c0392b;border-color:#c0392b}
label{display:block;margin-top:1em;font-size:.9em;color:var(--dim)}
input{width:100%;font:1.1em var(--font);padding:.65em .7em;margin-top:.3em;border-radius:var(--radius);border:2px solid var(--edge);background:rgba(127,127,127,.08);color:var(--ink)}
.msg{min-height:1.5em;margin-top:.8em;color:var(--ink)} .msg.bad{color:#e06a5b}
table{width:100%;border-collapse:collapse;margin-top:.5em;font-size:.92em} td,th{text-align:left;padding:.35em .3em;border-bottom:1px solid var(--edge)} th{color:var(--dim);font-weight:600}
.stat{display:flex;justify-content:space-between;gap:1em;padding:.5em 0;border-bottom:1px solid var(--edge)} .stat span:last-child{font-weight:700}
h2{font-size:1em;margin:1.4em 0 .2em;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
a{color:var(--accent)}
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite"></main>
<script src="/account/hace.js"></script>
<script>
(function () {
  'use strict';
  var H = window.HACE, q = new URLSearchParams(location.search), mode = q.get('mode') || '', game = q.get('game') || '', G = H.games[game] || null, card = document.getElementById('card');
  // only ever go back to a page on this site
  var back = (function () { var b = q.get('back') || ''; return /^\/(?!\/)/.test(b) ? b : G ? G.path : '/'; })();
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var leave = function () { location.replace(back); };
  var show = function (html) { card.innerHTML = (G ? '<div class="game">' + esc(G.name) + '</div>' : '') + html; var f = card.querySelector('input, button.primary'); if (f) f.focus(); };
  var on = function (sel, fn) { var e = card.querySelector(sel); if (e) e.addEventListener('click', fn); };

  // the prompt wears the game's own colours and type
  if (G) {
    var t = G.theme, r = document.documentElement.style;
    r.setProperty('--bg', t.bg); r.setProperty('--panel', t.panel); r.setProperty('--edge', t.edge); r.setProperty('--ink', t.ink); r.setProperty('--dim', t.dim); r.setProperty('--accent', t.accent); r.setProperty('--accent-ink', t.accentInk);
    r.setProperty('--radius', t.radius); r.setProperty('--font', t.font); r.setProperty('--head', t.head); r.setProperty('--caps', t.caps); r.setProperty('--track', t.track);
    if (t.chunky) document.body.setAttribute('data-chunky', '');
    if (t.fonts) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = t.fonts; document.head.appendChild(l); }
    document.title = 'Sign in · ' + G.name;
  }

  if (!H.enabled) { // switched off: nothing to do here
    if (mode) { H.skip(); return leave(); }
    return show('<h1>Accounts are not open yet</h1><p>Your progress in each game is saved in this browser.</p><div class="row"><a class="btn" href="/">Back to the games</a></div>');
  }

  function prompt() {
    show('<h1>Sign in to save your progress</h1><p class="lead">Signed-in players keep their progress on any computer. If you skip, your progress is only saved in this browser and could be lost (clearing your browser, switching computers).</p>' +
      '<div class="row"><button class="primary" id="in">Sign in</button><button id="skip">Skip</button></div>');
    on('#in', function () { notice(prompt); }); on('#skip', function () { H.skip(); leave(); });
  }
  // from inside a game, a browser that has never signed in is told first that the account starts fresh
  function notice(cancel) {
    if (!G || H.known) return signin(cancel);
    show('<h1>Your account starts fresh</h1><p class="lead">Progress saved in this browser as a guest won\'t carry over.</p><p>Your guest progress stays in this browser, and you get it back whenever you play signed out.</p>' +
      '<div class="row"><button class="primary" id="go">Continue</button><button id="no">Cancel</button></div>');
    on('#go', function () { signin(cancel); }); on('#no', cancel);
  }
  function signin(cancel) {
    show('<h1>Sign in</h1><p>Enter your email and we send you a 6-digit code. No password. A new email makes a new account.</p>' +
      '<label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email">' +
      '<div class="row"><button class="primary" id="send">Send code</button>' + (cancel ? '<button id="no">Cancel</button>' : '') + '</div><div class="msg" id="msg"></div>');
    var msg = card.querySelector('#msg'), em = card.querySelector('#em');
    on('#no', cancel);
    var send = function () {
      var email = em.value.trim(); if (!email) return; msg.className = 'msg'; msg.textContent = 'Sending…';
      H.requestCode(email).then(function (r) { if (!r.ok) { msg.className = 'msg bad'; msg.textContent = r.message || 'Could not send the code.'; return; } code(email, cancel, r.devCode); });
    };
    on('#send', send); em.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  }
  function code(email, cancel, devCode) {
    show('<h1>Enter the code</h1><p>We sent a 6-digit code to <b>' + esc(email) + '</b>. It works for 10 minutes.</p>' +
      '<label for="cd">Code</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6"' + (devCode ? ' value="' + esc(devCode) + '"' : '') + '>' +
      '<div class="row"><button class="primary" id="ok">Sign in</button><button id="no">Back</button></div><div class="msg" id="msg"></div>');
    var msg = card.querySelector('#msg'), cd = card.querySelector('#cd');
    on('#no', function () { signin(cancel); });
    var go = function () {
      msg.className = 'msg'; msg.textContent = 'Checking…';
      H.verify(email, cd.value.trim()).then(function (r) { if (!r.ok) { msg.className = 'msg bad'; msg.textContent = r.message || 'That code is not right.'; return; } r.fresh ? welcome() : signedIn(); });
    };
    on('#ok', go); cd.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }
  function welcome() {
    show('<h1>Welcome</h1><p class="lead">Your account is ready. A welcome gift of 5,000⚓ Credits is waiting for you in Steel Tide.</p><div class="row"><button class="primary" id="go">Continue</button></div>');
    on('#go', signedIn);
  }
  function signedIn() { if (mode && G && G.cloud) return sync(); if (mode) return leave(); account(); }
  // Bulwark and Tin Hats: fetch the account's progress before the game starts
  function sync() {
    show('<h1>Loading your saved progress…</h1><p>One moment.</p>');
    H.pull(game).then(function (res) {
      if (res === 'signed-out') return prompt();
      if (res === 'ok') { H.pulled(game); return leave(); }
      show('<h1>The server cannot be reached</h1><p class="lead">Your saved progress could not be loaded, and this browser has no copy of it yet. You can play as a guest for now; your account is untouched.</p><div class="row"><button class="primary" id="go">Play as a guest for now</button><button id="re">Try again</button></div>');
      on('#go', function () { H.pulled(game); leave(); }); on('#re', sync);
    });
  }
  function account() {
    var s = H.session(); if (!s) return signin(null);
    show('<h1>Your account</h1><div class="stat"><span>Email</span><span>' + esc(s.email) + '</span></div><div class="stat"><span>Steel Tide Credits</span><span id="cr">…</span></div>' +
      '<h2>Purchases</h2><div id="pur"><p>Loading…</p></div>' +
      '<div class="row"><a class="btn" href="/">Back to the games</a><button id="out">Sign out</button></div>' +
      '<div class="row"><button class="link" id="del">Delete my account</button></div><div class="msg" id="msg"></div>');
    var msg = card.querySelector('#msg');
    H.me().then(function (r) {
      if (!H.session()) return signin(null);                                  // the sign-in ran out
      var cr = card.querySelector('#cr'), pur = card.querySelector('#pur'); if (!cr) return;
      if (!r.ok) { cr.textContent = 'not available'; pur.innerHTML = '<p>The server cannot be reached right now.</p>'; return; }
      cr.textContent = Math.round(r.me.credits).toLocaleString('en-US') + '⚓';
      var list = r.me.purchases || [];
      pur.innerHTML = list.length ? '<table><tr><th>Date</th><th>Credits</th><th>Price</th><th>Status</th></tr>' + list.map(function (p) {
        return '<tr><td>' + new Date(p.created * 1000).toLocaleDateString() + '</td><td>' + Number(p.credits).toLocaleString('en-US') + '⚓</td><td>$' + (p.amount / 100).toFixed(2) + ' ' + esc(String(p.currency).toUpperCase()) + '</td><td>' + esc(p.status) + '</td></tr>';
      }).join('') + '</table>' : '<p>No purchases.</p>';
    });
    on('#out', function () { H.signOut().then(function () { location.replace('/'); }); });
    var armed = false;
    on('#del', function () {
      if (!armed) { armed = true; card.querySelector('#del').className = 'danger'; card.querySelector('#del').textContent = 'Yes, delete my account for good'; msg.textContent = 'This removes your account, your Steel Tide Credits and items, and your saved progress in every game from the server. It cannot be undone.'; return; }
      msg.textContent = 'Deleting…';
      H.deleteAccount().then(function (r) { if (r.ok) { show('<h1>Account deleted</h1><p>Everything kept for your account has been removed.</p><div class="row"><a class="btn" href="/">Back to the games</a></div>'); } else { msg.className = 'msg bad'; msg.textContent = r.message || 'Could not delete the account. Try again shortly.'; } });
    });
  }

  var s = H.session();
  if (mode === 'gate') return s ? signedIn() : prompt();
  if (mode === 'sync') return s ? sync() : prompt();
  if (mode === 'signin') return s ? signedIn() : notice(leave);
  account();
})();
</script>
</body>
</html>
